<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>连接测试</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Supabase 连接测试</h2>
    <div id="result"></div>
    <script>
        const SUPABASE_URL = 'https://beqxeyqmlqvninfpvajy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIs...'; // 👈 替换成你刚复制的完整密钥
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        async function test() {
            const { data, error } = await db.from('devices').select('*');
            if (error) {
                document.getElementById('result').innerHTML = '❌ 错误：' + error.message;
            } else {
                document.getElementById('result').innerHTML = '✅ 连接成功！共 ' + data.length + ' 条设备';
            }
        }
        test();
    </script>
</body>
</html>
