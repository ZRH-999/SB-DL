<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>设备维修管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4A90D9;
            --success: #52c41a;
            --warning: #faad14;
            --danger: #f5222d;
            --bg: #f5f6f8;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #e8ecf1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            width: 420px;
            max-width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 780px;
        }
        .header {
            background: var(--primary);
            color: #fff;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: var(--bg);
            padding: 14px;
        }
        .page { display: none; }
        .page.active { display: block; }
        .bottom-nav {
            display: flex;
            background: #fff;
            border-top: 1px solid #eee;
            height: 60px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            font-size: 11px;
            transition: 0.2s;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item .icon { font-size: 22px; margin-bottom: 2px; }
        .nav-item .badge {
            position: absolute;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 24px;
            margin-top: -8px;
        }
        .card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .stat-number { font-size: 32px; font-weight: 700; color: var(--primary); }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .tag-pending { background: #fff7e6; color: #d48806; }
        .tag-processing { background: #e6f7ff; color: #1890ff; }
        .tag-completed { background: #f0fff4; color: #389e0d; }
        .tag-urgent { background: #fff1f0; color: #cf1322; }
        .tag-running { background: #e6f7ff; color: #096dd9; }
        .tag-fault { background: #fff1f0; color: #cf1322; }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: #eee;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-block { display: block; width: 100%; margin-top: 8px; }
        .btn-sm { padding: 5px 14px; font-size: 12px; }
        .order-item, .device-card {
            display: flex;
            align-items: center;
            padding: 14px;
            background: #fff;
            border-radius: var(--radius);
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            gap: 12px;
        }
        .order-item.pending { border-left: 4px solid var(--warning); }
        .order-item.processing { border-left: 4px solid var(--primary); }
        .order-item.completed { border-left: 4px solid var(--success); }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-height: 75%;
            border-radius: 20px 20px 0 0;
            padding: 20px 18px 30px;
            overflow-y: auto;
        }
        .modal-handle {
            width: 36px; height: 5px;
            background: #ddd;
            border-radius: 3px;
            margin: 0 auto 18px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }
        .toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 200;
            pointer-events: none;
            animation: toastAnim 0.3s ease;
        }
        @keyframes toastAnim {
            from { opacity: 0; transform: translateX(-50%) translateY(-15px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 22px;
            font-size: 14px;
            background: #fff;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="header">🏭 设备维修管理</div>
    <div class="main-content">
        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="stats-row">
                <div class="stat-card" onclick="switchTab(1)"><div class="stat-number" id="statPending">0</div><div>⏳ 待处理</div></div>
                <div class="stat-card" onclick="switchTab(1)"><div class="stat-number" id="statProcessing">0</div><div>🔧 维修中</div></div>
                <div class="stat-card" onclick="switchTab(1)"><div class="stat-number" id="statCompleted">0</div><div>✅ 已完成</div></div>
                <div class="stat-card" onclick="switchTab(2)"><div class="stat-number" id="statDevices">0</div><div>📋 设备总数</div></div>
            </div>
            <div class="card">
                <div style="font-weight:600;margin-bottom:10px;">📊 今日概览</div>
                <div style="display:flex;justify-content:space-around;text-align:center;">
                    <div><div style="font-size:24px;font-weight:700;color:#f5222d;" id="urgentCount">0</div><div>紧急工单</div></div>
                    <div><div style="font-size:24px;font-weight:700;color:#4A90D9;" id="todayNew">0</div><div>今日新增</div></div>
                    <div><div style="font-size:24px;font-weight:700;color:#52c41a;" id="todayDone">0</div><div>今日完成</div></div>
                </div>
            </div>
            <button class="btn btn-primary btn-block" onclick="openReportModal()">📝 快速报修</button>
        </div>
        <!-- 工单页 -->
        <div class="page" id="page-orders">
            <div class="search-bar">
                <input class="search-input" placeholder="🔍 搜索工单..." id="orderSearch" oninput="renderOrders()">
                <select class="form-select" style="width:90px;" id="orderFilter" onchange="renderOrders()">
                    <option value="all">全部</option>
                    <option value="pending">待处理</option>
                    <option value="processing">维修中</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            <div id="orderList"></div>
        </div>
        <!-- 设备页 -->
        <div class="page" id="page-devices">
            <div class="search-bar">
                <input class="search-input" placeholder="🔍 搜索设备..." id="deviceSearch" oninput="renderDevices()">
                <button class="btn btn-primary btn-sm" onclick="openDeviceModal()">+ 添加</button>
            </div>
            <div id="deviceList"></div>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab(0)"><span class="icon">📊</span><span>首页</span></div>
        <div class="nav-item" onclick="switchTab(1)"><span class="icon">📋</span><span>工单</span><span class="badge" id="badgePending" style="display:none;">0</span></div>
        <div class="nav-item" onclick="switchTab(2)"><span class="icon">🖥️</span><span>设备</span></div>
    </div>
</div>

<!-- 报修弹窗 -->
<div class="modal-overlay" id="reportModal" style="display:none;">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">📝 设备报修</div>
        <select class="form-select" id="reportDevice"></select>
        <textarea class="form-textarea" id="reportDesc" placeholder="详细描述故障现象..."></textarea>
        <select class="form-select" id="reportUrgency"><option value="normal">普通</option><option value="urgent">紧急</option></select>
        <input class="form-input" id="reportPerson" placeholder="报修人姓名">
        <div style="display:flex;gap:10px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeReportModal()">取消</button>
            <button class="btn btn-primary" style="flex:1;" onclick="submitReport()">提交报修</button>
        </div>
    </div>
</div>
<!-- 设备添加弹窗 -->
<div class="modal-overlay" id="deviceModal" style="display:none;">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">🖥️ 添加设备</div>
        <input class="form-input" id="deviceName" placeholder="设备名称 *">
        <input class="form-input" id="deviceCode" placeholder="设备编号">
        <select class="form-select" id="deviceDept"><option>生产车间</option><option>研发部</option><option>质检部</option><option>仓库</option><option>办公室</option></select>
        <select class="form-select" id="deviceType"><option>机械设备</option><option>电气设备</option><option>仪器仪表</option><option>IT设备</option><option>其他</option></select>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeDeviceModal()">取消</button>
            <button class="btn btn-primary" style="flex:1;" onclick="submitDevice()">确认添加</button>
        </div>
    </div>
</div>
<!-- 工单详情弹窗 -->
<div class="modal-overlay" id="orderDetailModal" style="display:none;">
    <div class="modal-sheet" id="orderDetailContent"></div>
</div>

<script>
    // ========== 你的 Supabase 信息（已确认） ==========
    const SUPABASE_URL = 'https://beqxeyqmlqvninfpvajy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlcXhleXFtbHF2bmluZnB2YWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDc3MzQsImV4cCI6MjA5NDAyMzczNH0.25dZLSTu5jvmTB4Tx5XEIoAPMOwaUeoKriRJupSGxBk';
    // ===================================================

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function getDevices() {
        const { data } = await db.from('devices').select('*').order('id');
        return data || [];
    }
    async function getOrders() {
        const { data } = await db.from('orders').select('*').order('created_at', { ascending: false });
        return data || [];
    }

    let currentTab = 0;
    function switchTab(idx) {
        currentTab = idx;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(['page-home','page-orders','page-devices'][idx]).classList.add('active');
        document.querySelectorAll('.nav-item')[idx].classList.add('active');
        if (idx === 0) refreshHome();
        if (idx === 1) renderOrders();
        if (idx === 2) renderDevices();
    }

    function showToast(msg) {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.getElementById('app').appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    async function refreshHome() {
        const [orders, devices] = await Promise.all([getOrders(), getDevices()]);
        const pending = orders.filter(o => o.status === 'pending').length;
        const processing = orders.filter(o => o.status === 'processing').length;
        const completed = orders.filter(o => o.status === 'completed').length;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statProcessing').textContent = processing;
        document.getElementById('statCompleted').textContent = completed;
        document.getElementById('statDevices').textContent = devices.length;
        document.getElementById('urgentCount').textContent = orders.filter(o => o.urgency === 'urgent' && o.status !== 'completed').length;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('todayNew').textContent = orders.filter(o => o.created_at?.startsWith(today)).length;
        document.getElementById('todayDone').textContent = orders.filter(o => o.completed_at?.startsWith(today)).length;

        const badge = document.getElementById('badgePending');
        badge.textContent = pending;
        badge.style.display = pending > 0 ? 'flex' : 'none';
    }

    async function renderOrders() {
        const orders = await getOrders();
        const filter = document.getElementById('orderFilter').value;
        const search = document.getElementById('orderSearch').value.toLowerCase();
        let list = orders;
        if (filter !== 'all') list = list.filter(o => o.status === filter);
        if (search) list = list.filter(o => (o.device_name||'').toLowerCase().includes(search) || (o.desc||'').toLowerCase().includes(search) || (o.reporter||'').toLowerCase().includes(search));

        const container = document.getElementById('orderList');
        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">暂无工单</div>';
            return;
        }
        container.innerHTML = list.map(o => {
            const cls = o.status;
            const icons = { pending:'⏳', processing:'🔧', completed:'✅' };
            const labels = { pending:'待处理', processing:'维修中', completed:'已完成' };
            const urgentTag = o.urgency === 'urgent' ? '<span class="tag tag-urgent">紧急</span>' : '';
            const btn = o.status === 'pending'
                ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();assignOrder('${o.id}')">派工</button>`
                : o.status === 'processing'
                ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation();completeOrder('${o.id}')">完工</button>`
                : '';
            return `
            <div class="order-item ${cls}" onclick="openOrderDetail('${o.id}')">
                <span style="font-size:24px;">${icons[cls]}</span>
                <div style="flex:1;">
                    <strong>${o.device_name}</strong> ${urgentTag}
                    <div style="font-size:12px;color:#888;">${(o.desc||'').substring(0,20)} · ${o.reporter}</div>
                </div>
                <div style="text-align:right;">
                    <span class="tag tag-${cls}">${labels[cls]}</span>
                    <div style="margin-top:4px;">${btn}</div>
                </div>
            </div>`;
        }).join('');
    }

    async function assignOrder(id) {
        const tech = prompt('维修人员姓名：', '王工');
        if (!tech) return;
        await db.from('orders').update({ status: 'processing', assigned_to: tech }).eq('id', id);
        showToast('已派工给 ' + tech);
        refreshAll();
    }
    async function completeOrder(id) {
        if (!confirm('确认维修完成？')) return;
        const { data: ord } = await db.from('orders').select('device_id').eq('id', id).single();
        await db.from('orders').update({ status: 'completed', completed_at: new Date().toISOString() }).eq('id', id);
        if (ord) await db.from('devices').update({ status: 'running' }).eq('id', ord.device_id);
        showToast('维修已完成');
        refreshAll();
    }
    async function openOrderDetail(id) {
        const { data: o } = await db.from('orders').select('*').eq('id', id).single();
        if (!o) return;
        const labels = { pending:'待处理', processing:'维修中', completed:'已完成' };
        document.getElementById('orderDetailContent').innerHTML = `
            <div class="modal-handle"></div>
            <div class="modal-title">📋 工单详情</div>
            <div style="background:#f9f9f9;border-radius:12px;padding:16px;margin-bottom:12px;">
                <p><strong>设备：</strong>${o.device_name}</p>
                <p><strong>状态：</strong><span class="tag tag-${o.status}">${labels[o.status]}</span> ${o.urgency==='urgent'?'<span class="tag tag-urgent">紧急</span>':''}</p>
                <p><strong>描述：</strong>${o.desc}</p>
                <p><strong>报修人：</strong>${o.reporter}</p>
                <p><strong>时间：</strong>${new Date(o.created_at).toLocaleString()}</p>
                <p><strong>维修人：</strong>${o.assigned_to || '未分配'}</p>
                <p><strong>完成时间：</strong>${o.completed_at ? new Date(o.completed_at).toLocaleString() : '—'}</p>
            </div>
            ${o.status==='pending' ? `<button class="btn btn-primary btn-block" onclick="assignOrder('${o.id}');closeOrderDetail();">🔧 派工</button>` : ''}
            ${o.status==='processing' ? `<button class="btn btn-success btn-block" onclick="completeOrder('${o.id}');closeOrderDetail();">✅ 完工</button>` : ''}
            <button class="btn btn-outline btn-block" onclick="closeOrderDetail()">关闭</button>
        `;
        document.getElementById('orderDetailModal').style.display = 'flex';
    }
    function closeOrderDetail() {
        document.getElementById('orderDetailModal').style.display = 'none';
        refreshAll();
    }

    async function openReportModal() {
        const devs = await getDevices();
        document.getElementById('reportDevice').innerHTML = '<option value="">选择设备</option>' +
            devs.map(d => `<option value="${d.id}">${d.name} (${d.dept})</option>`).join('');
        document.getElementById('reportDesc').value = '';
        document.getElementById('reportPerson').value = '';
        document.getElementById('reportModal').style.display = 'flex';
    }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
    async function submitReport() {
        const devId = document.getElementById('reportDevice').value;
        const desc = document.getElementById('reportDesc').value.trim();
        const urgency = document.getElementById('reportUrgency').value;
        const reporter = document.getElementById('reportPerson').value.trim() || '匿名';
        if (!devId || !desc) return showToast('请完善信息');
        const { data: dev } = await db.from('devices').select('name').eq('id', devId).single();
        await db.from('orders').insert({
            device_id: devId, device_name: dev?.name || '未知', desc, urgency,
            status: 'pending', reporter, created_at: new Date().toISOString()
        });
        await db.from('devices').update({ status: 'fault' }).eq('id', devId);
        closeReportModal();
        refreshAll();
        showToast('报修已提交');
    }

    async function renderDevices() {
        const devs = await getDevices();
        const search = document.getElementById('deviceSearch').value.toLowerCase();
        let list = devs;
        if (search) list = list.filter(d => (d.name||'').toLowerCase().includes(search) || (d.code||'').toLowerCase().includes(search));
        const container = document.getElementById('deviceList');
        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">暂无设备</div>';
            return;
        }
        const colors = { '机械设备':'#e67e22', '电气设备':'#3498db', '仪器仪表':'#9b59b6', 'IT设备':'#2ecc71', '其他':'#95a5a6' };
        const icons = { '机械设备':'⚙️', '电气设备':'⚡', '仪器仪表':'🔬', 'IT设备':'💻', '其他':'📦' };
        container.innerHTML = list.map(d => `
            <div class="device-card">
                <div style="width:44px;height:44px;border-radius:10px;background:${colors[d.type]||'#888'};display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;">${icons[d.type]||'📦'}</div>
                <div style="flex:1;">
                    <strong>${d.name}</strong> <span class="tag ${d.status==='fault'?'tag-fault':'tag-running'}">${d.status==='fault'?'故障':'正常'}</span>
                    <div style="font-size:12px;color:#888;">${d.code} · ${d.dept}</div>
                </div>
                <span style="cursor:pointer;opacity:0.6;" onclick="event.stopPropagation();deleteDevice('${d.id}')">🗑️</span>
            </div>
        `).join('');
    }
    function openDeviceModal() { document.getElementById('deviceModal').style.display = 'flex'; }
    function closeDeviceModal() { document.getElementById('deviceModal').style.display = 'none'; }
    async function submitDevice() {
        const name = document.getElementById('deviceName').value.trim();
        if (!name) return showToast('请输入设备名称');
        await db.from('devices').insert({
            name, code: document.getElementById('deviceCode').value.trim() || 'EQ-'+Date.now(),
            dept: document.getElementById('deviceDept').value, type: document.getElementById('deviceType').value,
            status: 'running', created_at: new Date().toISOString()
        });
        closeDeviceModal();
        refreshAll();
        showToast('设备已添加');
    }
    async function deleteDevice(id) {
        if (!confirm('确定删除？')) return;
        await db.from('devices').delete().eq('id', id);
        refreshAll();
        showToast('已删除');
    }

    function refreshAll() { refreshHome(); renderOrders(); renderDevices(); }

    ['reportModal','deviceModal','orderDetailModal'].forEach(id => {
        document.getElementById(id).addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });
    });

    (async function() {
        try {
            await refreshAll();
        } catch (err) {
            console.error('初始化失败:', err);
            showToast('数据连接失败，请检查设置');
        }
    })();
</script>
</body>
</html>
