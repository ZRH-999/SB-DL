<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备维修管理系统 · 桌面版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4A90D9;
            --success: #52c41a;
            --warning: #faad14;
            --danger: #f5222d;
            --sidebar-bg: #1e2a3a;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            color: #ccc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar .logo {
            padding: 28px 20px 20px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar nav { flex: 1; padding: 16px 0; }
        .sidebar nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 24px; color: #a0b0c0; text-decoration: none;
            font-size: 15px; transition: all 0.2s; border-left: 3px solid transparent;
        }
        .sidebar nav a:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar nav a.active { background: rgba(255,255,255,0.1); color: #fff; border-left-color: var(--primary); }
        .sidebar .icon { font-size: 20px; width: 24px; text-align: center; }
        .main { flex: 1; overflow-y: auto; padding: 28px 32px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #333; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: var(--radius); padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .stat-num { font-size: 36px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 14px; color: #888; margin-top: 4px; }
        .alert-box {
            background: #fff1f0; border: 1px solid #ffa39e; border-left: 4px solid var(--danger);
            padding: 16px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
        }
        .alert-box .alert-num { font-size: 24px; font-weight: 700; color: var(--danger); }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
        .btn-sm { padding: 4px 12px; font-size: 13px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
        .search-bar input, .search-bar select { padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; }
        .search-bar input { flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; font-weight: 600; color: #555; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .tag-pending { background: #fff7e6; color: #d48806; }
        .tag-processing { background: #e6f7ff; color: #1890ff; }
        .tag-completed { background: #f0fff4; color: #389e0d; }
        .tag-urgent { background: #fff1f0; color: #cf1322; }
        .tag-overtime { background: #ff4d4f; color: #fff; }
        .order-row { border-left: 4px solid transparent; }
        .order-row.pending { border-left-color: var(--warning); }
        .order-row.processing { border-left-color: var(--primary); }
        .order-row.completed { border-left-color: var(--success); }
        .order-row.overtime { background: #fff1f0; border-left-color: var(--danger); }
        .progress-bar { height: 20px; background: #eee; border-radius: 10px; overflow: hidden; min-width: 80px; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.3s; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; border-radius: 12px; padding: 28px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 28px; border-radius: 8px; font-size: 14px; z-index: 2000; animation: toastIn 0.3s ease; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .search-dropdown { position: relative; }
        .search-dropdown .dropdown-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border: 1px solid #ddd; border-radius: 0 0 8px 8px; max-height: 200px;
            overflow-y: auto; z-index: 10; display: none;
        }
        .search-dropdown .dropdown-list.show { display: block; }
        .search-dropdown .dropdown-item {
            padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f0f0f0;
        }
        .search-dropdown .dropdown-item:hover { background: #f0f5ff; }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .logo, .sidebar nav a span { display: none; }
            .sidebar nav a { justify-content: center; padding: 16px; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🏭 设备维修</div>
        <nav>
            <a class="active" onclick="switchPage(0)" id="nav0"><span class="icon">📊</span> <span>首页</span></a>
            <a onclick="switchPage(1)" id="nav1"><span class="icon">📋</span> <span>工单管理</span></a>
            <a onclick="switchPage(2)" id="nav2"><span class="icon">🖥️</span> <span>设备台账</span></a>
            <a onclick="switchPage(3)" id="nav3"><span class="icon">📈</span> <span>报表中心</span></a>
        </nav>
    </div>

    <div class="main" id="mainContent">
        <div class="page active" id="page0">
            <div class="alert-box" id="alertBox" style="display:none;">
                <span>⚠️</span>
                <div style="flex:1;"><strong>超时预警</strong>：有报修工单超过2小时未派工！</div>
                <span class="alert-num" id="alertCount">0</span>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-num" id="sPending">0</div><div class="stat-label">待处理</div></div>
                <div class="stat-card"><div class="stat-num" id="sProcessing">0</div><div class="stat-label">维修中</div></div>
                <div class="stat-card"><div class="stat-num" id="sCompleted">0</div><div class="stat-label">已完成</div></div>
                <div class="stat-card"><div class="stat-num" id="sDevices">0</div><div class="stat-label">设备总数</div></div>
            </div>
            <button class="btn btn-primary" onclick="openReportModal()">📝 新建报修</button>
        </div>

        <div class="page" id="page1">
            <div class="search-bar">
                <input type="text" placeholder="🔍 搜索编号、设备、部门或描述..." id="orderSearch" oninput="renderOrders()">
                <select id="orderFilter" onchange="renderOrders()">
                    <option value="all">全部状态</option>
                    <option value="pending">待处理</option>
                    <option value="processing">维修中</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            <table id="orderTable"></table>
        </div>

        <div class="page" id="page2">
            <div class="search-bar">
                <input type="text" placeholder="🔍 搜索编号或设备名称..." id="deviceSearch" oninput="renderDevices()">
                <button class="btn btn-primary" onclick="openDeviceModal()">+ 添加设备</button>
            </div>
            <table id="deviceTable"></table>
        </div>

        <div class="page" id="page3">
            <div class="card"><div class="card-title">🔧 设备故障次数排名</div><div id="rptFaults"></div></div>
            <div class="card"><div class="card-title">📅 近7天工单趋势</div><div id="rptDaily"></div></div>
            <div class="card"><div class="card-title">👷 维修人员工作量</div><div id="rptWorkers"></div></div>
        </div>
    </div>

    <div class="modal" id="reportModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-title">📝 设备报修</div>
            <div class="search-dropdown">
                <input type="text" id="repDeviceSearch" placeholder="🔍 输入编号或名称搜索设备..." autocomplete="off" oninput="filterDeviceList()" onfocus="showDeviceDropdown()">
                <input type="hidden" id="repDeviceCode">
                <div class="dropdown-list" id="deviceDropdown"></div>
            </div>
            <textarea id="repDesc" placeholder="详细描述故障现象..." rows="3"></textarea>
            <select id="repUrgency"><option value="normal">普通</option><option value="urgent">紧急</option></select>
            <input id="repPerson" placeholder="报修人姓名">
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeModal('reportModal')">取消</button>
                <button class="btn btn-primary" onclick="submitReport()">提交</button>
            </div>
        </div>
    </div>
    <div class="modal" id="deviceModal" style="display:none;"><div class="modal-content"><div class="modal-title">🖥️ 添加设备</div><input id="devName" placeholder="设备名称 *"><input id="devCode" placeholder="设备编号"><select id="devDept"><option>生产车间</option><option>研发部</option><option>质检部</option><option>仓库</option></select><select id="devType"><option>机械设备</option><option>电气设备</option><option>仪器仪表</option><option>IT设备</option></select><div class="modal-buttons"><button class="btn btn-outline" onclick="closeModal('deviceModal')">取消</button><button class="btn btn-primary" onclick="submitDevice()">确认</button></div></div></div>
    <div class="modal" id="detailModal" style="display:none;"><div class="modal-content" id="detailContent"></div></div>

    <script>
        // ====== 你的 Supabase 信息（已更新密钥） ======
        const SUPABASE_URL = 'https://beqxeyqmlqvninfpvajy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlcXhleXFtbHF2bmluZnB2YWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDc3MzQsImV4cCI6MjA5NDAyMzczNH0.25dZLSTu5jvmTB4Tx5XEIoAPMOwaUeoKriRJupSGxBk';
        // ================================================
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let devices = [];
        let orders = [];

        async function loadDevices() {
            const { data } = await db.from('devices').select('*').order('id');
            devices = data || [];
        }
        async function loadOrders() {
            const { data } = await db.from('orders').select('*').order('created_at', { ascending: false });
            orders = data || [];
        }

        const OVERTIME_MS = 2 * 60 * 60 * 1000;
        function isOvertime(order) { return order.status === 'pending' && (Date.now() - new Date(order.created_at).getTime() > OVERTIME_MS); }

        function switchPage(idx) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page'+idx).classList.add('active');
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('nav'+idx).classList.add('active');
            if (idx === 0) refreshHome(); else if (idx === 1) renderOrders(); else if (idx === 2) renderDevices(); else if (idx === 3) renderReports();
        }

        function showToast(msg) { const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }

        async function refreshHome() {
            await loadOrders();
            document.getElementById('sPending').textContent = orders.filter(o=>o.status==='pending').length;
            document.getElementById('sProcessing').textContent = orders.filter(o=>o.status==='processing').length;
            document.getElementById('sCompleted').textContent = orders.filter(o=>o.status==='completed').length;
            document.getElementById('sDevices').textContent = devices.length;
            const overtime = orders.filter(o=>isOvertime(o)).length;
            document.getElementById('alertBox').style.display = overtime>0?'flex':'none';
            document.getElementById('alertCount').textContent = overtime;
        }

        async function renderOrders() {
            await loadOrders();
            const filter = document.getElementById('orderFilter').value;
            const search = document.getElementById('orderSearch').value.toLowerCase();
            let list = orders.filter(o => (filter==='all'||o.status===filter) && (o.device_name?.toLowerCase().includes(search) || o.device_code?.toLowerCase().includes(search) || o.desc?.toLowerCase().includes(search) || o.reporter?.includes(search) || (o.device_dept||'').includes(search)))
                .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

            const tbody = list.map(o => {
                const rowCls = `order-row ${o.status}${isOvertime(o)?' overtime':''}`;
                const statusLabel = { pending:'待处理', processing:'维修中', completed:'已完成' }[o.status];
                const tagCls = { pending:'tag-pending', processing:'tag-processing', completed:'tag-completed' }[o.status];
                const actionBtn = o.status==='pending'?`<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();assignOrder('${o.id}')">派工</button>`:o.status==='processing'?`<button class="btn btn-success btn-sm" onclick="event.stopPropagation();completeOrder('${o.id}')">完工</button>`:'';
                const overtimeTag = isOvertime(o)?'<span class="tag tag-overtime">超时</span>':'';
                return `<tr class="${rowCls}" onclick="openDetail('${o.id}')" style="cursor:pointer;">
                    <td>${o.device_dept||''}</td>
                    <td>${o.device_code||''}</td>
                    <td><strong>${o.device_name}</strong> ${o.urgency==='urgent'?'<span class="tag tag-urgent">紧急</span>':''} ${overtimeTag}</td>
                    <td>${(o.desc||'').substring(0,20)}</td>
                    <td>${o.reporter||''}</td>
                    <td>${o.assigned_to||'-'}</td>
                    <td><span class="tag ${tagCls}">${statusLabel}</span></td>
                    <td>${new Date(o.created_at).toLocaleString()}</td>
                    <td>${o.dispatched_at?new Date(o.dispatched_at).toLocaleString():'-'}</td>
                    <td>${o.completed_at?new Date(o.completed_at).toLocaleString():'-'}</td>
                    <td>${actionBtn}</td>
                </tr>`;
            }).join('');

            document.getElementById('orderTable').innerHTML = `
                <thead><tr><th>部门</th><th>设备编号</th><th>设备名称</th><th>描述</th><th>报修人</th><th>维修人</th><th>状态</th><th>建立时间</th><th>派工时间</th><th>完工时间</th><th>操作</th></tr></thead>
                <tbody>${tbody||'<tr><td colspan="11">暂无工单</td></tr>'}</tbody>`;
        }

        async function assignOrder(id) {
            const tech = prompt('维修人员姓名：','王工');
            if(!tech) return;
            await db.from('orders').update({ status:'processing', assigned_to:tech, dispatched_at:new Date().toISOString() }).eq('id',id);
            showToast('已派工给 '+tech); refreshAll();
        }
        async function completeOrder(id) {
            if(!confirm('确认维修完成？')) return;
            const { data: ord } = await db.from('orders').select('device_id').eq('id',id).single();
            await db.from('orders').update({ status:'completed', completed_at:new Date().toISOString() }).eq('id',id);
            if(ord) await db.from('devices').update({ status:'running' }).eq('id',ord.device_id);
            showToast('维修已完成'); refreshAll();
        }
        async function openDetail(id) {
            const { data: o } = await db.from('orders').select('*').eq('id',id).single();
            if(!o) return;
            document.getElementById('detailContent').innerHTML = `
                <div class="modal-title">📋 工单详情</div>
                <p><b>编号：</b>${o.device_code||'无'}</p>
                <p><b>部门：</b>${o.device_dept||'未指定'}</p>
                <p><b>设备：</b>${o.device_name}</p>
                <p><b>描述：</b>${o.desc}</p>
                <p><b>报修人：</b>${o.reporter}</p>
                <p><b>维修人：</b>${o.assigned_to||'未分配'}</p>
                <p><b>建立时间：</b>${new Date(o.created_at).toLocaleString()}</p>
                <p><b>派工时间：</b>${o.dispatched_at?new Date(o.dispatched_at).toLocaleString():'未派工'}</p>
                <p><b>完工时间：</b>${o.completed_at?new Date(o.completed_at).toLocaleString():'未完工'}</p>
                <div class="modal-buttons">
                    ${o.status==='pending'?`<button class="btn btn-primary" onclick="assignOrder('${o.id}');closeModal('detailModal')">🔧 派工</button>`:''}
                    ${o.status==='processing'?`<button class="btn btn-success" onclick="completeOrder('${o.id}');closeModal('detailModal')">✅ 完工</button>`:''}
                    <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
                </div>`;
            document.getElementById('detailModal').style.display='flex';
        }

        async function openReportModal() {
            await loadDevices();
            document.getElementById('repDeviceSearch').value = '';
            document.getElementById('repDeviceCode').value = '';
            document.getElementById('repDesc').value = '';
            document.getElementById('repPerson').value = '';
            document.getElementById('reportModal').style.display = 'flex';
            filterDeviceList();
        }

        function filterDeviceList() {
            const search = document.getElementById('repDeviceSearch').value.toLowerCase();
            const filtered = devices.filter(d => 
                d.code?.toLowerCase().includes(search) || 
                d.name?.toLowerCase().includes(search) ||
                d.dept?.toLowerCase().includes(search)
            );
            const dropdown = document.getElementById('deviceDropdown');
            dropdown.innerHTML = filtered.length ? filtered.map(d => `
                <div class="dropdown-item" onclick="selectDevice('${d.code}', '${d.name}', '${d.dept}')">
                    <strong>${d.code}</strong> - ${d.name} <span style="color:#888;">(${d.dept})</span>
                </div>
            `).join('') : '<div class="dropdown-item" style="color:#999;">未找到匹配设备</div>';
            dropdown.classList.add('show');
        }

        function selectDevice(code, name, dept) {
            document.getElementById('repDeviceSearch').value = `${code} - ${name} (${dept})`;
            document.getElementById('repDeviceCode').value = code;
            document.getElementById('deviceDropdown').classList.remove('show');
        }

        function showDeviceDropdown() { filterDeviceList(); }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-dropdown')) document.getElementById('deviceDropdown').classList.remove('show');
        });

        async function submitReport() {
            const devCode = document.getElementById('repDeviceCode').value;
            const desc = document.getElementById('repDesc').value.trim();
            const urgency = document.getElementById('repUrgency').value;
            const reporter = document.getElementById('repPerson').value.trim()||'匿名';
            if(!devCode||!desc) return showToast('请完善信息（请从下拉列表中选择设备）');
            const dev = devices.find(d=>d.code===devCode);
            if(!dev) return showToast('未找到该编号的设备，请重新选择');
            await db.from('orders').insert({
                device_id:dev.id, device_name:dev.name, device_code:dev.code,
                device_dept:dev.dept, desc, urgency, status:'pending', reporter,
                created_at:new Date().toISOString()
            });
            await db.from('devices').update({ status:'fault' }).eq('id',dev.id);
            closeModal('reportModal'); refreshAll(); showToast('报修已提交');
        }

        async function renderDevices() {
            await loadDevices();
            const search = document.getElementById('deviceSearch').value.toLowerCase();
            const list = devices.filter(d=>d.name?.toLowerCase().includes(search)||d.code?.toLowerCase().includes(search));
            document.getElementById('deviceTable').innerHTML = `
                <thead><tr><th>编号</th><th>设备名称</th><th>部门</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>${list.map(d=>`<tr><td>${d.code}</td><td>${d.name}</td><td>${d.dept}</td><td>${d.type}</td><td><span class="tag ${d.status==='fault'?'tag-urgent':'tag-processing'}">${d.status==='fault'?'故障':'正常'}</span></td><td><button class="btn btn-outline btn-sm" onclick="deleteDevice('${d.id}')">删除</button></td></tr>`).join('')||'<tr><td colspan="6">暂无设备</td></tr>'}</tbody>`;
        }
        function openDeviceModal() { document.getElementById('deviceModal').style.display='flex'; }
        async function submitDevice() {
            const name = document.getElementById('devName').value.trim();
            if(!name) return showToast('请输入设备名称');
            await db.from('devices').insert({
                name, code:document.getElementById('devCode').value.trim()||'EQ-'+Date.now(),
                dept:document.getElementById('devDept').value, type:document.getElementById('devType').value, status:'running'
            });
            closeModal('deviceModal'); refreshAll(); showToast('设备已添加');
        }
        async function deleteDevice(id) {
            if(!confirm('确定删除？')) return;
            await db.from('devices').delete().eq('id',id);
            refreshAll(); showToast('已删除');
        }

        async function renderReports() {
            await loadOrders(); await loadDevices();
            const faultCount = {}; orders.forEach(o=>{ if(o.status!=='completed') faultCount[o.device_id]=(faultCount[o.device_id]||0)+1; });
            const maxFault = Math.max(1,...Object.values(faultCount));
            let htmlFault='<table><tr><th>编号</th><th>设备</th><th>部门</th><th>故障次数</th><th>占比</th></tr>';
            devices.forEach(d=>{ const cnt=faultCount[d.id]||0; htmlFault+=`<tr><td>${d.code}</td><td>${d.name}</td><td>${d.dept}</td><td>${cnt}</td><td><div class="progress-bar"><div class="progress-fill" style="width:${(cnt/maxFault)*100}%"></div></div></td></tr>`; });
            document.getElementById('rptFaults').innerHTML=htmlFault+'</table>';

            const dates=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dates.push(d.toISOString().split('T')[0]);}
            const daily={}; dates.forEach(d=>daily[d]={total:0,pending:0,processing:0,completed:0});
            orders.forEach(o=>{const d=o.created_at?.split('T')[0];if(daily[d]){daily[d].total++;daily[d][o.status]++;}});
            let htmlDaily='<table><tr><th>日期</th><th>总工单</th><th>待处理</th><th>维修中</th><th>已完成</th></tr>';
            dates.forEach(d=>{const s=daily[d];htmlDaily+=`<tr><td>${d}</td><td>${s.total}</td><td>${s.pending}</td><td>${s.processing}</td><td>${s.completed}</td></tr>`;});
            document.getElementById('rptDaily').innerHTML=htmlDaily+'</table>';

            const workers={}; orders.forEach(o=>{if(o.assigned_to){if(!workers[o.assigned_to]) workers[o.assigned_to]={total:0,completed:0,totalHours:0}; workers[o.assigned_to].total++; if(o.status==='completed'&&o.completed_at){workers[o.assigned_to].completed++; workers[o.assigned_to].totalHours+=(new Date(o.completed_at)-new Date(o.dispatched_at||o.created_at))/3600000;}}});
            let htmlWorker='<table><tr><th>姓名</th><th>总工单</th><th>已完成</th><th>平均耗时(h)</th></tr>';
            Object.entries(workers).forEach(([name,s])=>{const avg=s.completed>0?(s.totalHours/s.completed).toFixed(1):'-'; htmlWorker+=`<tr><td>${name}</td><td>${s.total}</td><td>${s.completed}</td><td>${avg}</td></tr>`;});
            document.getElementById('rptWorkers').innerHTML=Object.keys(workers).length?htmlWorker+'</table>':'暂无维修人员数据';
        }

        async function refreshAll() { await Promise.all([refreshHome(), renderOrders(), renderDevices()]); if(document.getElementById('page3').classList.contains('active')) renderReports(); }
        window.onclick = function(e) { if(e.target.classList.contains('modal')) e.target.style.display='none'; };
        refreshAll();
    </script>
</body>
</html>
